function reveal(el,o,k,first){el.querySelector('.t').innerHTML=hl(o[0],o[1]);el.querySelector('.x').innerHTML='<div class="lens"><span class="chip '+(o[1]?'y':'n')+'" style="animation-delay:'+(first*.15)+'s">Grammar '+(o[1]?'✓':'✗')+'</span><span class="chip '+(o[2]?'y':'n')+'" style="animation-delay:'+(first*.15+.08)+'s">Culture '+(o[2]?'✓':'✗')+'</span></div><div class="note">'+o[3]+'</div>'}
function pick(j){
 if(st.locked)return;var q=Q[st.i],t=st.teams[st.turn],ok=j==q.a,b=document.querySelectorAll('.opt');
 if(!ok&&st.armed){st.armed=false;st.retry=true;t.streak=0;reveal(b[j],q.o[j],j,0);b[j].classList.add('wrong');b[j].disabled=true;sBad();$('#toast').textContent='Second Chance used — เลือกคำตอบใหม่ได้เลย';return}
 st.locked=true;clearInterval(tmr);var el=(Date.now()-st.t0)/1000,fast=el<TL/2;
 b.forEach(function(e,k){e.disabled=true;if(!(st.retry&&k==j&&!ok&&e.classList.contains('wrong')))reveal(e,q.o[k],k,k);if(k==q.a)e.classList.add('right');else if(k==j&&!e.classList.contains('wrong'))e.classList.add('wrong');else if(!e.classList.contains('wrong'))e.classList.add('dim')});
 var gain=0,nt='';
 if(ok){t.streak++;gain=st.retry?50:100+(t.streak-1)*20+(fast?20:0);t.coins+=gain;t.med++;t.pos=st.i+1;sGood();sparks();nt=' · +'+gain+' coins'}else{t.streak=0;sBad()}
 st.res[st.i]={ok:ok,team:t.n};ME.picks.push([j,ok?1:0]);ME.st='ans';
 var card=$('#card'),s=document.createElement('div');s.className='seal'+(ok?' g':'');s.innerHTML=ok?'<big>✓</big>APPROVED':'<big>✗</big>REVIEW';card.appendChild(s);
 var last=st.i==Q.length-1,h='<div class="insight"><h4>THE ATLAS NOTE'+nt+'</h4>'+q.ins+'<div class="rule">กฎ: should / shouldn’t + กริยาช่อง 1 (base verb) — ไม่มี to, -s หรือ -ing</div></div>';
 if(ok){h+='<div class="dicebox" id="dbx"><div class="die roll" id="die"></div><div id="dtx"><b class="cz">Roll for bonus coins…</b></div></div>'}
 h+='<div style="text-align:center;margin-top:18px"><button class="btn" id="nx" onclick="nextTurn()" '+(ok?'disabled':'')+'>'+(last?'Final Scores':'Next Turn')+'</button></div>';
 $('#after').innerHTML=h;hud();
 if(ok){mark(st.i+1);place(st.turn);rollDie(t)}
 $('#after').scrollIntoView({behavior:'smooth',block:'center'});
}
function face(n){var m={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n],h='';for(var k=0;k<9;k++)h+='<i'+(m.indexOf(k)>-1?(n==1?' class="r"':''):' style="visibility:hidden"')+'></i>';return h}
function rollDie(t){var d=$('#die'),c=0,iv=setInterval(function(){d.innerHTML=face(1+Math.floor(Math.random()*6));sTick();if(++c>9){clearInterval(iv);var r=1+Math.floor(Math.random()*6);d.classList.remove('roll');d.innerHTML=face(r);t.coins+=r*10;$('#dtx').innerHTML='<b class="cz" style="color:#e6c673">Rolled '+r+'!</b><br>+'+(r*10)+' bonus coins · pawn advances to station '+t.pos;sGood();hud();$('#nx').disabled=false}},110)}
function nextTurn(){st.i++;if(st.i>=Q.length){return endGame()}st.turn=(st.turn+1)%st.teams.length;deck()}
function endGame(){ME.done=true;ME.st='done';sync();
 var r=st.teams.slice().sort(function(a,b){return b.coins-a.coins}),w=r[0],tie=r.length>1&&r[1].coins==w.coins;
 var meds=Q.map(function(q,k){var x=st.res[k];return '<div class="med'+(x&&x.ok?' ok':'')+'"><b>'+(x&&x.ok?'★':'○')+'</b>'+q.lab+'<br>'+(x?x.team:'')+'</div>'}).join('');
 var rk=r.map(function(t,k){return '<div><span class="dot" style="background:'+t.c+';border-color:#2a1c12"></span><b class="cz">'+(k+1)+'. '+t.n+'</b><span style="margin-left:auto">'+t.coins+' coins · ★ '+t.med+'</span></div>'}).join('');
 app.innerHTML='<div class="cert">'+'<svg class="orn" style="filter:invert(.55) sepia(1) saturate(3)" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="none" stroke="#000" stroke-width="2"/><path d="M60 8l8 44l44 8l-44 8l-8 44l-8-44l-44-8l44-8z" fill="none" stroke="#000" stroke-width="2"/></svg><div class="cz" style="letter-spacing:.3em;font-size:12px;color:#6f5a45">CERTIFICATE OF CULTURAL FLUENCY</div><h1 class="cz">'+(tie?'A Shared Victory':'Champion Advisor')+'</h1><div class="win">'+(tie?r.filter(function(t){return t.coins==w.coins}).map(function(t){return t.n}).join(' & '):w.n)+'</div><div style="color:#6f5a45">'+w.coins+' coins · giving advice with should / shouldn’t</div><div class="rank">'+rk+'</div><div class="meds">'+meds+'</div></div><div class="noprint" style="text-align:center"><button class="btn" onclick="startGame()">Play Again</button> &nbsp; <button class="btn sm" onclick="window.print()">Print Certificate</button> &nbsp; <button class="btn sm" onclick="setup()">Change Name</button></div><div id="sum2"></div>';
 sparks();sGood();liveR();window.scrollTo({top:0})}
/* ---------- live (host / realtime) via Firebase ---------- */
var ROOM=null,ROOMCODE='',ISH=false,PEERS=[],HIST={},FEED=[],ME={name:'',picks:[],coins:0,qi:-1,done:false,st:'lobby'};
var LIVE_UID=sessionStorage.getItem('cc_uid')||('u_'+Math.random().toString(36).slice(2,10));
sessionStorage.setItem('cc_uid',LIVE_UID);
var SPK='<g fill="#fff" opacity=".85"><path class="flk" d="M28 28l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><path class="flk" style="animation-delay:1s" d="M372 40l2 6 6 2-6-2 6-2z"/><circle class="bob" cx="350" cy="205" r="3"/><circle class="bob" cx="40" cy="200" r="2.5" style="animation-delay:.6s"/></g>';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function makeRoomCode(){return Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)}
function roomRef(){return ROOMCODE?FBDB.ref('rooms/'+ROOMCODE):null}
function playerRef(){return ROOMCODE?FBDB.ref('rooms/'+ROOMCODE+'/players/'+LIVE_UID):null}
function connectRoom(code,host){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); if(!code)return false;
  ROOMCODE=code; ISH=!!host;
  if(history.replaceState) history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(ROOMCODE)+(ISH?'&host=1':''));
  ROOM=roomRef();
  if(ISH){
    ROOM.child('host').set({online:true}).catch(function(e){console.error(e)});
  }else{
    var pr=playerRef();
    pr.onDisconnect().remove();
    pr.set({name:ME.name||'',picks:[],coins:0,qi:-1,done:false,st:'lobby',online:true});
    FBDB.ref('.info/connected').on('value',function(s){if(s.val()===true){pr.onDisconnect().remove();pr.update({online:true})}});
  }
  ROOM.child('players').on('value',function(s){
    var obj=s.val()||{}, arr=[]; HIST={};
    Object.keys(obj).forEach(function(id){var d=obj[id]||{};HIST[id]={name:String(d.name||'').slice(0,14),picks:Array.isArray(d.picks)?d.picks:[],coins:+d.coins||0,qi:d.qi,done:!!d.done,st:String(d.st||''),on:d.online!==false,me:id===LIVE_UID}});
    ingestFirebase(); liveR();
  });
  if(ISH)liveR();
  return true;
}
function pub(){
  try{
    if(!ROOMCODE || ISH) return;
    var p=playerRef();
    if(!p)return;
    p.update({name:String(ME.name||'').slice(0,14),picks:Array.isArray(ME.picks)?ME.picks:[],coins:+ME.coins||0,qi:ME.qi,done:!!ME.done,st:String(ME.st||'lobby'),online:true});
  }catch(e){console.error(e)}
}
function sync(){if(!st||!st.teams||!st.teams[0])return;ME.coins=st.teams[0].coins;pub()}
function ingestFirebase(){
  var seen={};
  Object.keys(HIST).forEach(function(id){
    var h=HIST[id],pk=(Array.isArray(h.picks)?h.picks:[]).slice(0,Q.length).map(function(x){return [(+x[0])|0,x[1]?1:0]}),nm=h.name;
    seen[id]=1;
    if(ISH&&!h.seen)FEED.unshift('👋 '+(nm||'ผู้เล่น')+' เข้ามาในห้อง');
    var old=h._oldPicks||[];
    if(ISH&&pk.length>old.length){var x=pk[pk.length-1];FEED.unshift((nm||'ผู้เล่น')+' ตอบข้อ '+pk.length+(x[1]?' ✓ ถูก':' ✗ ผิด (เลือก '+'ABCD'[x[0]]+')'))}
    if(ISH&&h.done&&!h._oldDone)FEED.unshift('🏁 '+(nm||'ผู้เล่น')+' เล่นจบแล้ว');
    h.picks=pk;h._oldPicks=pk.slice();h._oldDone=h.done;h.seen=1;
  });
  FEED=FEED.slice(0,8);
}
function rows(all){var a=Object.keys(HIST).map(function(k){return HIST[k]}).filter(function(h){return all||h.st!='lobby'});
  if(!a.some(function(h){return h.me})&&!ISH&&ME.st!='lobby')a.push({name:ME.name,picks:ME.picks,coins:ME.coins,me:1,on:1,done:ME.done,st:ME.st,qi:ME.qi});
  return a.sort(function(x,y){return y.coins-x.coins})}
function sumTable(all){var a=rows(all);if(!a.length)return '<p class="lv0">ยังไม่มีผู้เล่นเข้ามา — แชร์ลิงก์ห้องให้เพื่อน ๆ เข้ามาเล่นได้เลย</p>';
  var h='<div class="lvw"><table class="lv"><tr><th>#</th><th>ผู้เล่น</th>';Q.forEach(function(q,k){h+='<th title="'+esc(q.title)+'">'+(k+1)+'<small>'+q.lab+'</small></th>'});h+='<th>คะแนน</th></tr>';
  a.forEach(function(p,r){h+='<tr class="'+(p.me?'me ':'')+(p.on?'':'off')+'"><td>'+(r+1)+'</td><td class="nm"><i class="'+(p.on?'on':'')+'"></i>'+esc(p.name||'…')+(p.me?' (คุณ)':'')+(p.st=='lobby'?' <small>รอเริ่ม</small>':'')+(p.done?' 🏁':'')+'</td>';
    Q.forEach(function(q,k){var x=p.picks[k],c;if(x)c='<b class="'+(x[1]?'y':'n')+'">'+(x[1]?'✓':'✗'+'ABCD'[x[0]])+'</b>';else if(p.st=='think'&&p.qi==k)c='<b class="w">…</b>';else c='<b class="e">·</b>';h+='<td>'+c+'</td>'});
    h+='<td class="sc">'+(+p.coins||0)+'</td></tr>'});
  h+='<tr class="ft"><td colspan="2">ตอบถูก / ตอบแล้ว</td>';Q.forEach(function(q,k){var n=a.filter(function(p){return p.picks[k]}).length,ok=a.filter(function(p){return p.picks[k]&&p.picks[k][1]}).length;h+='<td>'+(n?ok+'/'+n:'–')+'</td>'});return h+'<td></td></tr></table></div>'}
function liveR(){
  var L=$('#live'),S=$('#sum2'); if(!L)return;
  var on=Object.keys(HIST).filter(function(k){return HIST[k].on}).length;
  if(ISH){var a=rows(1),dn=a.length&&a.every(function(p){return p.done});L.innerHTML='<div class="host"><div class="hh"><span class="rec"></span> HOST LIVE <span class="cnt">ห้อง '+esc(ROOMCODE)+' · ออนไลน์ '+on+' คน</span></div><div style="text-align:center;margin:6px 0 12px;font-size:13px">แชร์ลิงก์นี้ให้ผู้เล่น: <b>'+esc(location.origin+location.pathname+'?room='+encodeURIComponent(ROOMCODE))+'</b></div>'+(dn?'<div class="fin">🏁 ทุกคนเล่นจบแล้ว — สรุปผลรอบนี้</div>':'')+sumTable(1)+'<div class="feed">'+(FEED.map(function(f){return '<div>'+esc(f)+'</div>'}).join('')||'<div>รอผู้เล่น…</div>')+'</div></div>'}
  else if(ROOMCODE)L.innerHTML='<div class="ol">🟢 ห้อง '+esc(ROOMCODE)+' · ออนไลน์ '+on+' คน</div>';
  else L.innerHTML='';
  if(S)S.innerHTML='<div class="host"><div class="hh">📊 สรุปผลทั้งห้อง</div>'+sumTable(0)+'</div>';
}
function setup(){
  ME.st='lobby';ME.picks=[];ME.done=false;ME.coins=0;ME.qi=-1;
  var q=new URLSearchParams(location.search),urlRoom=(q.get('room')||'').toUpperCase(),urlHost=q.get('host')==='1';
  if(urlRoom){ROOMCODE=urlRoom;ISH=urlHost;}
  app.innerHTML='<div class="lid">'+orn()+'<div class="sub">The Board Game of</div><h1>CULTURE CULJAI</h1><div class="sub">271-402 · Should ◆ Shouldn’t — Thailand &amp; the West</div><p style="margin:16px 0 10px">เล่นเดี่ยว จั่วการ์ดสถานการณ์ เลือกคำแนะนำที่ถูกทั้งไวยากรณ์และวัฒนธรรม ทอยลูกเต๋า เดินหมาก และสะสมเหรียญให้มากที่สุด — พิธีกรเห็นความคืบหน้าของทุกคนแบบสด ๆ</p><div class="names" style="grid-template-columns:1fr"><label><span class="dot" style="background:'+COL[0]+'"></span><input id="playerName" maxlength="14" placeholder="ใส่ชื่อของคุณ" value="'+esc(NAMES[0])+'" oninput="NAMES[0]=this.value;ME.name=this.value.trim();pub()"></label></div>'+
  '<div style="margin:12px 0;padding:12px;border:1px solid #b8892f55;border-radius:10px"><div style="font-weight:700;margin-bottom:8px">LIVE ROOM</div><input id="roomCode" maxlength="8" placeholder="รหัสห้อง เช่น AB12" value="'+esc(ROOMCODE)+'" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #b8892f88;background:#fff;color:#222;text-transform:uppercase"><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" onclick="createHost()">🎙️ สร้างห้อง HOST</button><button class="btn sm" onclick="joinRoom()">👥 เข้าห้องผู้เล่น</button></div><div style="font-size:11px;opacity:.75;margin-top:7px">HOST สร้างห้องก่อน แล้วส่งลิงก์ให้ผู้เล่น</div></div>'+
  (ISH&&ROOMCODE?'<div style="text-align:center;margin:8px 0">ห้องนี้คือ <b>'+esc(ROOMCODE)+'</b> · คุณเป็น HOST</div>':'')+
  '<button class="btn" onclick="startGame()">'+(ISH?'Open the Box (HOST)':'Open the Box')+'</button></div>';
  if(urlRoom&&!urlHost){ME.name=NAMES[0]||'';pub()}
}
function createHost(){
  var code=makeRoomCode(); document.getElementById('roomCode').value=code; ME.name=(document.getElementById('playerName').value||'').trim();NAMES[0]=ME.name;connectRoom(code,true);liveR();
}
function joinRoom(){
  var name=(document.getElementById('playerName').value||'').trim(),code=(document.getElementById('roomCode').value||'').trim().toUpperCase();
  if(!name){alert('กรุณาใส่ชื่อก่อน');return} if(!code){alert('กรุณาใส่รหัสห้อง');return}
  ME.name=name;NAMES[0]=name;connectRoom(code,false);pub();liveR();
}
async function initLive(){
  try{var q=new URLSearchParams(location.search),code=(q.get('room')||'').toUpperCase();if(code){connectRoom(code,q.get('host')==='1')}}catch(e){console.error(e)}
}
setup();initLive();
